<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2310990904 - BFHL Challenge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 600px;
      padding: 0 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }
    .response-section {
      margin-top: 30px;
      display: none;
      background: white;
      padding: 20px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .filter-group {
      margin-bottom: 15px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    pre {
      background-color: #f1f1f1;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Graph Data Processor (BFHL)</h1>
  
  <div class="form-group">
    <label for="json-input">API Input (JSON format):</label>
    <textarea id="json-input" placeholder='{ "data": ["A->B", "B->C", "X->Y"] }'></textarea>
  </div>
  
  <button id="submit-btn">Submit</button>
  
  <div id="error-msg" class="error"></div>

  <div id="response-section" class="response-section">
    <div class="filter-group">
      <label for="multi-filter">Multi Filter:</label>
      <select id="multi-filter" multiple size="4">
        <option value="hierarchies" selected>Hierarchies</option>
        <option value="summary" selected>Summary</option>
        <option value="invalid_entries" selected>Invalid Entries</option>
        <option value="duplicate_edges" selected>Duplicate Edges</option>
      </select>
      <small style="color: #666;">Hold Ctrl (Windows) / Cmd (Mac) to select multiple options</small>
    </div>

    <h3>Filtered Response</h3>
    <pre id="filtered-response"></pre>
  </div>

  <script>
    const submitBtn = document.getElementById('submit-btn');
    const jsonInput = document.getElementById('json-input');
    const errorMsg = document.getElementById('error-msg');
    const responseSection = document.getElementById('response-section');
    const multiFilter = document.getElementById('multi-filter');
    const filteredResponse = document.getElementById('filtered-response');

    let apiResponse = null;

    submitBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      responseSection.style.display = 'none';
      
      const rawValue = jsonInput.value.trim();
      if (!rawValue) {
        errorMsg.textContent = 'Please enter JSON input.';
        return;
      }

      let parsedJson;
      try {
        parsedJson = JSON.parse(rawValue);
      } catch (e) {
        errorMsg.textContent = 'Invalid JSON format.';
        return;
      }

      if (!parsedJson.data || !Array.isArray(parsedJson.data)) {
        errorMsg.textContent = 'JSON must contain a "data" array.';
        return;
      }

      try {
        let url = '/bfhl';
        if (window.location.protocol === 'file:' || 
            ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port !== '5000')) {
          url = 'http://localhost:5000/bfhl';
        }
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(parsedJson)
        });

        if (!response.ok) {
          const errData = await response.json();
          errorMsg.textContent = errData.error || 'Server error occurred.';
          return;
        }

        apiResponse = await response.json();
        responseSection.style.display = 'block';
        updateDisplay();
      } catch (err) {
        errorMsg.textContent = 'Failed to connect to the server.';
      }
    });

    multiFilter.addEventListener('change', updateDisplay);

    function updateDisplay() {
      if (!apiResponse) return;

      const selectedOptions = Array.from(multiFilter.selectedOptions).map(opt => opt.value);
      const filtered = {};

      selectedOptions.forEach(key => {
        if (apiResponse.hasOwnProperty(key)) {
          filtered[key] = apiResponse[key];
        }
      });

      filteredResponse.textContent = JSON.stringify(filtered, null, 2);
    }
  </script>
</body>
</html>
